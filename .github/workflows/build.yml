name: Build Sparky IPTV

on:
  push:
    branches: [ main ]
    # Documentation-only changes don't need a new app build.
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the app
        run: |
          chmod +x gradlew
          # Show compiler errors as annotations, so they're visible without the full log.
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log; status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            grep -E "^e: |What went wrong" -A2 build.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done
            exit $status
          fi

      - name: Name the app file
        run: cp app/build/outputs/apk/release/app-release.apk sparky-iptv.apk

      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Sparky IPTV build ${{ github.run_number }}
          body: |
            Install on Google TV with the Downloader app using:
            https://github.com/${{ github.repository }}/releases/latest/download/sparky-iptv.apk
          files: sparky-iptv.apk
          make_latest: true

      - uses: actions/upload-artifact@v4
        with:
          name: sparky-iptv
          path: sparky-iptv.apk
