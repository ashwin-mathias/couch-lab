name: Build Sparky IPTV

on:
  push:
    branches: [ main ]
    # Documentation-only changes don't need a new app build.
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing. Add the signing secrets in Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build the app
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          # 3.0: the shared code's tests run first; then the Android TV app.
          # Show compiler errors and failed tests as annotations, so they're visible without the full log.
          ./gradlew --no-daemon :core:test :apps:android-tv:assembleRelease 2>&1 | tee build.log; status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            grep -E "^e: |What went wrong|FAILED$|Test.*FAILED" -A2 build.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done
            exit $status
          fi

      - name: Name the app file
        run: |
          cp apps/android-tv/build/outputs/apk/release/android-tv-release.apk sparky-iptv.apk
          # The app checks this fingerprint before it installs an update.
          sha256sum sparky-iptv.apk | cut -d' ' -f1 > sparky-iptv.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            sparky-iptv.apk
            sparky-iptv.apk.sha256

  windows:
    runs-on: windows-latest
    defaults: { run: { shell: pwsh } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Bundle libVLC
        run: |
          $v = "3.0.21"
          curl.exe -sSL -o vlc.zip "https://get.videolan.org/vlc/$v/win64/vlc-$v-win64.zip"
          Expand-Archive vlc.zip -DestinationPath vlcx
          $src = Get-ChildItem vlcx -Directory | Select-Object -First 1
          $dst = "apps/desktop/resources/windows/vlc"
          New-Item -ItemType Directory -Force $dst | Out-Null
          Copy-Item "$($src.FullName)/libvlc.dll","$($src.FullName)/libvlccore.dll" $dst
          Copy-Item "$($src.FullName)/plugins" $dst -Recurse
          foreach ($d in "gui","lua","visualization","video_splitter","services_discovery") { Remove-Item "$dst/plugins/$d" -Recurse -Force -ErrorAction SilentlyContinue }
          "{0:N1} MB" -f ((Get-ChildItem $dst -Recurse | Measure-Object Length -Sum).Sum / 1MB)
      - name: Build the app
        run: ./gradlew --no-daemon :apps:desktop:createDistributable
      - name: Package (portable ZIP + MSIX)
        run: |
          $app = "apps/desktop/build/compose/binaries/main/app/Sparky IPTV"
          Get-ChildItem $app | Format-Table Name
          Compress-Archive -Path $app -DestinationPath sparky-iptv-windows-x64.zip
          $ver = "3.1.$env:GITHUB_RUN_NUMBER.0"
          (Get-Content apps/desktop/packaging/windows/AppxManifest.xml) -creplace '@VERSION@', $ver | Set-Content "$app/AppxManifest.xml"
          Copy-Item apps/desktop/packaging/windows/Assets "$app/Assets" -Recurse
          $makeappx = Get-ChildItem "C:/Program Files (x86)/Windows Kits/10/bin/*/x64/makeappx.exe" | Sort-Object FullName | Select-Object -Last 1
          & $makeappx.FullName pack /d $app /p sparky-iptv-windows-x64.msix /o
          Get-ChildItem *.zip,*.msix | Format-Table Name,Length
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            sparky-iptv-windows-x64.zip
            sparky-iptv-windows-x64.msix

  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Bundle libVLC
        run: |
          v=3.0.21
          curl -sSL -o vlc.dmg "https://get.videolan.org/vlc/$v/macosx/vlc-$v-arm64.dmg"
          hdiutil attach -nobrowse -mountpoint /tmp/vlcmnt vlc.dmg
          dst=apps/desktop/resources/macos-arm64/vlc
          mkdir -p $dst
          cp -a /tmp/vlcmnt/VLC.app/Contents/MacOS/lib/. $dst/
          cp -a /tmp/vlcmnt/VLC.app/Contents/MacOS/plugins $dst/plugins
          hdiutil detach /tmp/vlcmnt
          for d in gui lua visualization video_splitter services_discovery; do rm -rf $dst/plugins/$d; done
          ls $dst; du -sh $dst
      - name: Build the app
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :apps:desktop:createDistributable
      - name: Sign (ad hoc) and make the DMG
        run: |
          app="apps/desktop/build/compose/binaries/main/app/Sparky IPTV.app"
          codesign --force --deep --sign - "$app"
          mkdir dmg && cp -a "$app" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "Sparky IPTV" -srcfolder dmg -ov -format UDZO sparky-iptv-mac-arm64.dmg
          ls -la *.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: sparky-iptv-mac-arm64.dmg

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb vlc libvlc-dev imagemagick ffmpeg > /dev/null
      - run: |
          chmod +x gradlew
          ./gradlew --no-daemon :apps:desktop:createDistributable
          ffmpeg -loglevel error -f lavfi -i testsrc=size=1280x720:rate=25 -f lavfi -i sine=frequency=440 -t 30 -pix_fmt yuv420p -shortest /tmp/test.mp4
          export SKIKO_RENDER_API=SOFTWARE
          Xvfb :99 -screen 0 1600x900x24 & sleep 2
          export DISPLAY=:99
          app="apps/desktop/build/compose/binaries/main/app/Sparky IPTV/bin/Sparky IPTV"
          "$app" > app.log 2>&1 & pid=$!; sleep 25; import -window root setup.png
          xdotool key Down 2>/dev/null || true
          kill $pid || true; sleep 2
          SPARKY_DEMO_VIDEO=file:///tmp/test.mp4 "$app" > demo.log 2>&1 & pid=$!; sleep 20; import -window root video.png
          kill $pid || true
          grep -v ALSA app.log | tail -5; grep -v ALSA demo.log | tail -5
          # The desktop app must start, load libVLC and show video frames.
          grep -q "App started" app.log || { echo "::error::Desktop app didn't start"; exit 1; }
          grep -q "libVLC" demo.log || { echo "::error::Desktop app didn't load libVLC"; exit 1; }

  # Publishes once the Android app is built. The Windows and Mac files are attached when their
  # builds succeed, so a desktop problem never holds back a TV update.
  release:
    needs: [android, windows, mac]
    if: ${{ always() && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: ls -la dist
      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Sparky IPTV build ${{ github.run_number }}
          body: |
            **Google TV:** install with the Downloader app using
            https://github.com/${{ github.repository }}/releases/latest/download/sparky-iptv.apk
            After that, Sparky updates itself from Settings.

            **Windows 11 (x64):** sparky-iptv-windows-x64.zip — unzip and run "Sparky IPTV.exe" (for testing).
            sparky-iptv-windows-x64.msix is the Microsoft Store package (submitted through Partner Center).

            **Mac (Apple Silicon):** sparky-iptv-mac-arm64.dmg — open it and drag Sparky IPTV to Applications.
            The first time, macOS says it can't verify the app: open System Settings → Privacy & Security → Open Anyway.
          files: |
            dist/sparky-iptv.apk
            dist/sparky-iptv.apk.sha256
            dist/sparky-iptv-windows-x64.zip
            dist/sparky-iptv-windows-x64.msix
            dist/sparky-iptv-mac-arm64.dmg
          fail_on_unmatched_files: false
          make_latest: true
