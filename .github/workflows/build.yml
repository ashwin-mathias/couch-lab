name: Build Sparky IPTV

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the app
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Name the app file
        run: cp app/build/outputs/apk/release/app-release.apk sparky-iptv.apk

      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Sparky IPTV 1.0.${{ github.run_number }}
          body: |
            Install on Google TV with the Downloader app using:
            https://github.com/${{ github.repository }}/releases/latest/download/sparky-iptv.apk
          files: sparky-iptv.apk
          make_latest: true

      - uses: actions/upload-artifact@v4
        with:
          name: sparky-iptv
          path: sparky-iptv.apk
