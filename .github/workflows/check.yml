name: Compile check (temporary)
on:
  push:
    branches: [ wip-3.0 ]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - run: |
          chmod +x gradlew
          ./gradlew --no-daemon :core:test :apps:android-tv:assembleRelease 2>&1 | tee build.log; status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then grep -E "^e: |What went wrong|FAILED|ERROR:|Missing class" -A3 build.log | head -60 | while IFS= read -r line; do echo "::error::$line"; done; exit $status; fi
          ls -la apps/android-tv/build/outputs/apk/release/
